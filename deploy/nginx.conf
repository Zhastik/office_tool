worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format service_json escape=json
        '{"event":"http_request","time":"$time_iso8601","request_id":"$request_id",'
        '"method":"$request_method","status":$status,'
        '"duration_s":$request_time,"upstream_status":"$upstream_status"}';
    access_log /dev/stdout service_json;

    map $request_method $method_rejected {
        default 1;
        GET 0;
        HEAD 0;
    }
    map $method_rejected $allowed_methods {
        1 "GET, HEAD";
        default "";
    }
    map "$content_length:$http_transfer_encoding" $body_rejected {
        default 1;
        ":" 0;
        "0:" 0;
    }
    map "$status:$uri" $cache_control {
        ~^[0-9]+:/api/ "no-store";
        ~^(200|206|304):/assets/ "public, max-age=31536000, immutable";
        ~^[45][0-9][0-9]: "no-store";
        default "no-cache";
    }

    upstream fastapi {
        zone fastapi 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        server api:8000 resolve;
        keepalive 8;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/wasm application/json image/svg+xml;
    sendfile on;

    server {
        listen 8080;
        absolute_redirect off;
        root /srv/pdfwork;
        client_max_body_size 1k;
        client_header_timeout 10s;
        client_body_timeout 10s;

        include /etc/nginx/pdfwork-browser-headers.conf;
        add_header X-Request-ID $request_id always;
        add_header Allow $allowed_methods always;
        add_header Cache-Control $cache_control always;

        if ($method_rejected) { return 405; }
        if ($body_rejected) { return 400; }

        location = /healthz {
            return 204;
        }

        location ^~ /api/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Content-Length "";
            proxy_pass_request_body off;
            proxy_hide_header X-Request-ID;
            proxy_hide_header Cache-Control;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_pass http://fastapi;
        }

        location = / {
            try_files /index.html =503;
        }

        location ~ \.mjs$ {
            types { application/javascript mjs; }
            try_files $uri =404;
        }

        location / {
            try_files $uri =404;
        }
    }
}

